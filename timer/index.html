<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타이머 — 남하루</title><link rel="stylesheet" href="style.css?v=2"><script>if(new URLSearchParams(location.search).has("compact"))document.documentElement.classList.add("compact");</script><body><main><header><span>NAMHARU</span><b>카운트다운 타이머</b></header><div id="status" role="status">시간을 설정하세요</div><div id="display" role="timer" aria-label="남은 시간">05:00</div><div class="track"><div id="progress"></div></div><section id="settings"><div class="time-inputs"><label><input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric">분</label><label><input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric">초</label></div><div class="presets"><button data-adjust="-60">−1분</button><button data-adjust="-10">−10초</button><button data-adjust="10">+10초</button><button data-adjust="60">+1분</button></div></section><p id="error" role="alert"></p><div class="actions"><button id="start">시작</button><button id="reset">초기화</button></div></main><script src="game.js?v=2"></script></body></html>
