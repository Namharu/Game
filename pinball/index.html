<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="색깔 공을 골라 핀볼 맵에서 순위를 겨루는 컬러볼 레이스">
  <title>컬러볼 핀볼 — NAMHARU GAME</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <main class="arcade">
    <a class="back-link" href="../">← 게임 목록</a>
    <section class="machine" aria-label="핀볼 경기장">
      <div class="mini-lights"><i></i><i></i><i></i></div>
      <div class="canvas-wrap">
        <canvas id="raceCanvas" width="280" height="1000" aria-label="컬러볼 핀볼 레이스 화면"></canvas>
        <div id="countdown" class="countdown" hidden></div>
      </div>
    </section>
    <section class="stage">
      <header class="stage-title"><small>COLOR BALL ROULETTE</small><h1>컬러볼 핀볼</h1><b id="raceState">출전할 공을 선택하세요</b></header>
      <section class="rank-section" aria-label="도착 순위"><div class="rank-count"><strong id="finishCount">0</strong><span> / 0</span></div><ol id="ranking" class="ranking"><li class="empty">순위 대기 중</li></ol></section>
      <section class="pick-section"><p>공을 눌러 출전 여부를 선택하세요</p><div id="ballPicker" class="ball-picker"></div></section>
      <section class="console-panel">
        <div class="console-info"><strong>출전 공</strong><span>빨강 · 주황 · 노랑 · 초록 · 파랑 · 남색 · 보라</span><em>최소 2개 선택 · 결승선 도착 순서대로 순위 결정</em></div>
        <div class="console-controls"><div class="selection-line"><span>선택</span><strong id="selectedCount">0개</strong></div><p id="error" class="error" role="alert"></p><div class="actions"><button id="resetButton" class="secondary" type="button">↝ 다시 선택</button><button id="startButton" class="primary" type="button"><span>▶ 시작</span></button></div></div>
      </section>
    </section>
  </main>
  <script src="game.js?v=4"></script>
</body>
</html>
