<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede6d6">
  <meta name="description" content="방송 화면 하나로 즐기는 남하루 미니게임 모음">
  <title>NAMHARU GAME — 미니게임</title>
  <link rel="stylesheet" href="hub.css?v=17">
  <link rel="stylesheet" href="typography.css?v=1">
</head>
<body>
  <div id="frame-viewport" class="frame-viewport">
    <main id="broadcast-frame" class="broadcast-frame" aria-label="남하루 미니게임 방송 화면">
      <aside class="game-menu">
        <a class="brand" href="./" aria-label="남하루 게임 첫 화면">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><b>NAMHARU</b><small>MINI GAME</small></span>
        </a>

        <div class="menu-heading">
          <span>GAME LIST</span>
          <strong>&lt;&lt;</strong>
        </div>

        <nav id="game-list" class="game-list" aria-label="게임 목록">
          <button type="button" data-game=""><span>⌂</span><b>메인 화면</b></button>
          <button type="button" data-game="draw"><span>01</span><b>통합 뽑기</b></button>
          <button type="button" data-game="ladder"><span>02</span><b>사다리</b></button>
          <button type="button" data-game="high-low"><span>03</span><b>하이로우</b></button>
          <button type="button" data-game="pinball"><span>04</span><b>핀볼</b></button>
          <button type="button" data-game="animal-race"><span>05</span><b>동물경주</b></button>
          <button type="button" data-game="cannon"><span>06</span><b>대포</b></button>
          <button type="button" data-game="lotto"><span>07</span><b>로또 추첨기</b></button>
          <button type="button" data-game="wheel"><span>08</span><b>돌림판</b></button>
          <button type="button" data-game="coin"><span>09</span><b>동전 앞뒤</b></button>
          <button type="button" data-game="dice"><span>10</span><b>주사위 던지기</b></button>
        </nav>

      </aside>

      <section class="game-area">
        <header class="game-titlebar">
          <div>
            <span id="game-number">HOME</span>
            <h1 id="game-title">남하루 미니게임</h1>
          </div>
          <div class="title-actions">
            <span class="live-dot"><i></i> GAME READY</span>
            <a hidden id="standalone-link" href="./draw/" target="_blank" rel="noopener">새 창으로 열기 ↗</a>
          </div>
        </header>

        <div class="play-window">
          <section id="home-screen" class="home-screen" aria-label="게임 제작 문의"><section class="home-timer" aria-label="카운트다운 타이머"><iframe src="./timer/?compact=1&v=3" title="메인 카운트다운 타이머"></iframe><button type="button" id="timer-launch">새창 열기 ↗</button></section><div class="home-intro"><p>게임 추가 / 전용 제작 문의</p><h2>오픈 카톡</h2><strong>남하루 미니게임 검색</strong></div></section>
        </div>
      </section>
    </main>
  </div>

  <script src="hub.js?v=22"></script>
</body>
</html>
