<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="설치 없이 즐기는 남하루의 브라우저 게임 모음">
  <title>NAMHARU GAME — Game Archive</title>
  <link rel="stylesheet" href="hub.css?v=1">
</head>
<body>
  <main class="hub">
    <header class="hub-header">
      <a class="logo" href="./" aria-label="남하루 게임 홈">
        <span class="logo-dot" aria-hidden="true"></span>
        <span>NAMHARU GAME</span>
      </a>
      <div class="archive-label">
        <span>WEB GAME ARCHIVE</span>
        <span class="archive-count">001</span>
      </div>
    </header>

    <section class="intro" aria-labelledby="intro-title">
      <p class="intro-number">PLAY / 001</p>
      <h1 id="intro-title">심심할 때,<br><em>한 판.</em></h1>
      <p class="intro-copy">설치 없이 바로 즐기는<br>브라우저 게임 아카이브</p>
    </section>

    <section class="game-library" aria-label="게임 목록">
      <a class="game-card draw-card" href="./draw/">
        <span class="card-number">01</span>
        <span class="card-visual" aria-hidden="true">
          <i>?</i><i>?</i><i>?</i><i>?</i><i>?</i><i>?</i><i>?</i><i>?</i><i>?</i>
        </span>
        <span class="card-content">
          <span class="card-meta">LUCK · PARTY</span>
          <strong>추억의 뽑기</strong>
          <span class="card-description">상품과 등수를 직접 정하고<br>원하는 번호를 골라보세요.</span>
        </span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>

      <div class="game-card coming-card" aria-label="다음 게임 준비 중">
        <span class="card-number">02</span>
        <span class="coming-text">NEXT GAME</span>
        <span class="card-content">
          <span class="card-meta">COMING SOON</span>
          <strong>다음 게임</strong>
          <span class="card-description">새로운 게임을 준비하고 있어요.</span>
        </span>
      </div>
    </section>

    <footer>
      <span>© NAMHARU GAME</span>
      <span>PLAY ANYTIME, ANYWHERE</span>
    </footer>
  </main>
</body>
</html>
