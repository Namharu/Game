<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동전 앞뒤 — NAMHARU GAME</title><link rel="stylesheet" href="style.css?v=4"><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded");</script><body><header><b>남하루 · 동전 앞뒤</b><a href="../">게임 목록으로</a></header><main><section class="stage"><div class="topline">NAMHARU GAME <span>COIN FLIP</span></div><h1>어느 쪽이 나올까?</h1><p id="status" aria-live="polite">아래에서 앞 또는 뒤를 선택하세요</p><div class="coin-area" aria-label="500원 동전"><span class="shadow" id="shadow"></span><span class="flight" id="flight"><span class="coin" id="coin"><span class="face heads"><img src="assets/500-crane.jpg" alt="500원 앞면: 학"></span><span class="face tails"><img src="assets/500-number.jpg" alt="500원 뒷면: 숫자 500"></span></span></span></div><div class="predictions"><button id="headsChoice">앞</button><button id="tailsChoice">뒤</button></div><div class="last" aria-live="polite"><div><span>나온 면</span><strong id="result">—</strong></div><div><span>정답 여부</span><strong id="verdict">—</strong></div></div><div class="stage-bottom"><span>앞면 / 뒷면</span><span>앞: 학 그림 · 뒤: 숫자 500</span></div></section><aside><small>COIN FLIP</small><h2>동전 앞뒤</h2><p class="intro">앞 또는 뒤를 선택해<br>나올 면을 맞혀보세요.</p><label for="speed">던지는 속도 <output id="speedValue">1.0배</output></label><input type="range" id="speed" min="0.5" max="3" step="0.5" value="1"><div class="stats"><div><span>앞면</span><b id="headCount">0</b></div><div><span>뒷면</span><b id="tailCount">0</b></div></div><div class="history-head"><b>최근 결과</b><span id="total">0회</span></div><div id="history" aria-live="polite"><p>아직 던진 동전이 없어요.</p></div><div class="actions"><button id="clear">기록 초기화</button></div></aside></main><footer>600 × 600 게임 화면</footer><script src="game.js?v=2"></script></body></html>
