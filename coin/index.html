<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동전 앞뒤 — NAMHARU GAME</title><link rel="stylesheet" href="style.css?v=1"><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded");</script><body><header><b>남하루 · 동전 앞뒤</b><a href="../">게임 목록으로</a></header><main><section class="stage"><div class="topline">NAMHARU GAME <span>COIN FLIP</span></div><h1>어느 쪽이 나올까?</h1><p id="status" aria-live="polite">동전을 눌러 던져보세요</p><button class="coin-area" id="coinButton" aria-label="동전 던지기"><span class="shadow" id="shadow"></span><span class="flight" id="flight"><span class="coin" id="coin"><span class="face heads"><span class="rim"><span class="tiny">NAMHARU · LUCKY COIN</span><span class="symbol">★</span><strong>앞면</strong><span class="eng">HEADS</span></span></span><span class="face tails"><span class="rim"><span class="tiny">NAMHARU · LUCKY COIN</span><span class="symbol">✦</span><strong>뒷면</strong><span class="eng">TAILS</span></span></span></span></span></button><div class="last"><span>이번 결과</span><strong id="result">—</strong></div><div class="stage-bottom"><span>앞면 / 뒷면</span><span>동전 클릭 또는 Space</span></div></section><aside><small>COIN FLIP</small><h2>동전 앞뒤</h2><p class="intro">고민될 때, 동전 한 번.<br>앞면과 뒷면으로 결정하세요.</p><label for="speed">던지는 속도 <output id="speedValue">1.0배</output></label><input type="range" id="speed" min="0.5" max="3" step="0.5" value="1"><div class="stats"><div><span>앞면</span><b id="headCount">0</b></div><div><span>뒷면</span><b id="tailCount">0</b></div></div><div class="history-head"><b>최근 결과</b><span id="total">0회</span></div><div id="history" aria-live="polite"><p>아직 던진 동전이 없어요.</p></div><div class="actions"><button id="flip">동전 던지기</button><button id="clear">기록 초기화</button></div></aside></main><footer>600 × 600 게임 화면</footer><script src="game.js?v=1"></script></body></html>
