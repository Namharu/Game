<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>후원 시그 오버레이</title><link rel="stylesheet" href="style.css?v=easy-13"></head><body class="overlay"><div id="board"></div><button id="panelToggle" type="button" aria-expanded="false" aria-controls="testPanel">테스트 패널</button><section id="testPanel" hidden aria-label="후원 테스트 패널"><div class="panel-head"><strong>후원 테스트</strong><button id="panelClose" type="button" class="secondary">접기</button></div><form id="panelForm"><label>닉네임<input id="panelName" maxlength="100" required autocomplete="off"></label><label>단일 후원 개수<input id="panelCount" type="number" min="1" max="1000000000" step="1" required></label><div class="actions presets"><button type="button" data-count="100" class="secondary">100개</button><button type="button" data-count="282" class="secondary">282개</button><button type="button" data-count="704" class="secondary">704개</button><button type="button" data-count="1000" class="secondary">1,000개</button></div><button type="submit">테스트 후원 띄우기</button><button id="panelClear" type="button" class="secondary">테스트만 삭제</button></form><p id="panelResult" role="status">현재 표시 조건을 적용합니다. 실제 후원이 아닙니다.</p><p>닉네임과 개수를 바꿔 연속 테스트하세요.<br>H: 패널 숨김/표시 · T: 현재 값 실행 · X: 테스트 삭제<br>입력 중에는 단축키가 작동하지 않습니다.</p><details><summary>전용 네임택 등록</summary><div id="nicknameImages"></div></details><button id="panelHide" type="button" class="secondary">패널과 버튼 모두 숨기기 (H로 복원)</button></section><div id="status" role="status">시그 로딩 중</div><script>addEventListener("error",function(e){document.getElementById("status").textContent="시그 실행 오류: "+(e.message||"파일 로드 실패");},true);</script><script src="../shared/centrifuge-2.8.5.min.js"></script><script src="../shared/panda-chat.js?v=easy-13"></script><script src="core.js?v=easy-13"></script><script src="layout.js?v=easy-13"></script><script src="../shared/nickname-images.js?v=easy-13"></script><script src="app.js?v=easy-13"></script></body></html>
