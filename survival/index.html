<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동물 서바이벌 — NAMHARU</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><div id="scene" aria-label="동물 서바이벌 3D 경기장"></div>
<header><div><small>NAMHARU ORIGINAL</small><h1>동물 서바이벌</h1></div><button id="sound" aria-pressed="true">소리 켜짐</button></header>
<div class="hud" hidden><b id="alive"></b><span id="clock">00:00</span><span id="phase">경기 시작</span></div>
<section id="setup" class="panel"><span class="eyebrow">LAST ANIMAL STANDING</span><h2>동물 서바이벌</h2><p>최후의 한 마리를 맞혀보세요</p>
<div id="map-cards" aria-label="경기장 선택"></div><label class="map-label">경기장<select id="map"><option value="cliff">노을 절벽 · 낙석</option><option value="windmill">풍차 언덕 · 회전 막대</option><option value="ice">얼음 섬 · 미끄러운 구멍</option><option value="bridge">구름 다리 · 무너지는 발판</option><option value="bus">달리는 버스 · 높이 제한</option><option value="factory">공장 · 컨베이어와 프레스</option></select></label><div class="fields"><label>참가 인원<select id="count"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select></label><label>예상 경기 시간<select id="duration"><option value="30">30초</option><option value="60" selected>60초</option><option value="90">90초</option><option value="120">120초</option></select></label></div>
<div class="names-title"><b>참가자 이름</b><button id="defaults">기본값</button></div><div id="names"></div><div class="volume-row"><label for="volume">효과음</label><input type="range" id="volume" min="0" max="100" value="60"><span id="volume-value">60%</span></div><p class="hint">2~16마리 · 자동 진행 · 마지막 생존자가 우승합니다</p><button id="start" class="primary">서바이벌 시작</button></section>
<div id="countdown" aria-live="polite"></div><div id="notice" role="status"></div><div id="roster"></div>
<footer hidden><button id="pause">일시정지</button><button id="restart">다시 시작</button><button id="settings">설정</button></footer>
<section id="result" class="panel" hidden><span class="eyebrow">SOLE SURVIVOR</span><div id="winner-icon"></div><h2 id="winner"></h2><p>최후의 생존자</p><ol id="ranking"></ol><button id="again" class="primary">같은 멤버로 재경기</button><button id="edit">참가자 바꾸기</button></section>
<div id="fatal" hidden role="alert">3D 화면을 시작하지 못했어요. WebGL을 지원하는 브라우저에서 다시 열어주세요.</div></main><script type="module" src="game.js?v=2"></script></body></html>
