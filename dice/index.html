<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주사위 던지기 — NAMHARU GAME</title><link rel="stylesheet" href="style.css?v=4"><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded");</script><body><header><b>남하루 · 주사위 던지기</b><a href="../">게임 목록으로</a></header><main><section class="stage"><div class="eyebrow">NAMHARU GAME <span>DICE ROLL</span></div><h1>주사위를 던져보세요</h1><p id="status" aria-live="polite">주사위 2개 · 준비 완료</p><div id="diceArea" aria-label="주사위 결과"></div><div id="prediction" hidden><button id="choiceA" type="button">홀</button><button id="choiceB" type="button">짝</button></div><div class="result" aria-live="polite"><div><small>총합</small><strong id="sum">—</strong></div><div><small>홀짝</small><strong id="parity">—</strong></div><div><small>정답 여부</small><strong id="verdict">—</strong></div></div><p id="formula">주사위를 던지면 결과가 표시됩니다.</p><div class="bottom">각 주사위는 1~6 · 합계를 기준으로 홀짝 판정</div></section><aside><small>DICE ROLL</small><h2>주사위 던지기</h2><fieldset id="mode"><legend>게임 모드</legend><label><input type="checkbox" name="mode" value="parity" checked>홀짝</label><label><input type="checkbox" name="mode" value="updown">업다운</label></fieldset><label for="count">주사위 개수</label><select id="count"><option value="1">1개</option><option value="2" selected>2개</option><option value="3">3개</option><option value="4">4개</option><option value="5">5개</option><option value="6">6개</option></select><label for="speed">던지는 속도 <output id="speedValue">1.0배</output></label><input id="speed" type="range" min="0.5" max="3" value="1" step="0.5"><div class="history-title"><b>최근 결과</b><span id="round">0회</span></div><ol id="history"><li class="empty">아직 던진 기록이 없어요.</li></ol><div class="actions"><button id="roll">주사위 던지기</button><button id="clear">기록 초기화</button></div></aside></main><footer>600 × 600 게임 화면</footer><script src="game.js?v=4"></script></body></html>
