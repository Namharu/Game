<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로또번호 추첨기 — NAMHARU GAME</title><link rel="stylesheet" href="styles.css?v=air-draw-8"><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded");</script><body><header><b>남하루 · 로또 추첨기</b><a href="../">게임 목록으로</a></header><main><section id="stage"><div class="badge"><i></i> LOTTERY MACHINE <span>NAMHARU GAME</span></div><div id="view"></div><section id="matchPanel" aria-live="polite"><b>당첨 여부</b><p id="matchSummary">설정을 입력하고 추첨을 시작하세요.</p></section><button id="manualDraw" hidden>번호추첨</button><section id="results" aria-live="polite"><b>추첨 번호</b><div id="resultBalls"></div></section><div class="stage-foot"><span id="state">플레이어 준비 중</span><b>45 BALLS</b></div><p id="error" hidden></p></section><aside><small>NAMHARU GAME</small><h1>로또 추첨기</h1><label for="drawCount">뽑을 공 개수</label><input id="drawCount" type="number" min="1" max="45" value="6"><label for="winningNumbers">당첨번호</label><input id="winningNumbers" type="text" placeholder="예: 3, 7, 21" value="7"><p class="help">1~45 중 하나 또는 여러 개 · 쉼표나 공백으로 구분</p><p id="validation" role="alert"></p><div class="draw-options"><label><input type="checkbox" id="sortNumbers">작은 번호순 정렬</label><label for="drawMode">추첨 방식</label><select id="drawMode"><option value="auto">자동 추첨</option><option value="manual">수동 추첨</option></select></div><label for="drawSpeed">추첨 속도 <output id="drawSpeedValue">1.0배</output></label><input id="drawSpeed" type="range" min="0.5" max="10" step="0.1" value="1"><section id="drawResults" aria-live="polite"><b id="resultTitle">추첨 번호</b><div id="drawNumbers"></div></section><div class="actions"><button id="mix" disabled>추첨 시작 ▶</button><button id="reset" disabled>새 게임</button></div></aside></main><footer>1~45번 · 중복 없는 추첨</footer><script type="module" src="game.js?v=air-draw-8"></script></body></html>
